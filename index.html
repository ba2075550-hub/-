<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر TechGear | المتجر التقني الأول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070a10;
            --bg-card: #0d131f;
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.35);
            --saudi-green: #00e676;
            --saudi-glow: rgba(0, 230, 118, 0.3);
            --gold: #ffb300;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.08);
            --danger: #ff5252;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            font-size: 15px;
            line-height: 1.6;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 210, 255, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 230, 118, 0.04) 0px, transparent 50%);
        }

        .glass-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
        }

        .text-green { color: var(--saudi-green) !important; }
        .text-blue { color: var(--primary) !important; }
        .text-gold { color: var(--gold) !important; }

        .top-announcement-bar {
            background: linear-gradient(90deg, #094022, #008744, #094022);
            color: #fff;
            text-align: center;
            padding: 9px 15px;
            font-size: 13.5px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .dark-navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(7, 10, 16, 0.96);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-container {
            max-width: 1400px;
            margin: auto;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .nav-right-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .round-menu-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #151922;
            border: 1px solid rgba(255, 255, 255, 0.12);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.25s ease;
        }

        .round-menu-btn .menu-line {
            width: 18px;
            height: 2.5px;
            background: #ffffff;
            border-radius: 4px;
        }

        .round-menu-btn:hover {
            background: #202736;
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            user-select: none;
        }

        .logo-badge {
            background: linear-gradient(135deg, var(--primary), #0077b6);
            color: #040910;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .logo-accent { color: var(--primary); }

        .search-bar-box {
            flex: 1;
            max-width: 480px;
            position: relative;
        }

        .search-bar-box i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
        }

        .search-bar-box input {
            width: 100%;
            padding: 12px 48px 12px 18px;
            background: rgba(15, 22, 34, 0.85);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 12px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 700;
            font-size: 14.5px;
            padding: 8px 14px;
            border-radius: 12px;
        }

        .nav-links a:hover, .nav-links a.active-link {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .sign-in-btn, .cart-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            color: #fff;
            padding: 9px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .categories-tabs-section {
            max-width: 1400px;
            margin: 15px auto 10px;
            padding: 0 24px;
            display: flex;
            justify-content: center;
        }

        .tactical-nav {
            display: flex !important;
            align-items: center;
            gap: 10px;
            background: #050a08 !important;
            padding: 7px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 230, 118, 0.25);
        }

        .tactical-tab {
            background: #060e0a !important;
            border: 1.2px solid rgba(0, 230, 118, 0.4) !important;
            color: #ffffff !important;
            padding: 7px 15px !important;
            border-radius: 8px !important;
            cursor: pointer;
            font-size: 14px !important;
            font-weight: 800 !important;
            display: inline-flex !important;
            align-items: center;
            gap: 7px;
        }

        .tactical-tab.active-tab {
            background: #007a3d !important;
            border-color: #00ff88 !important;
            box-shadow: 0 0 14px rgba(0, 230, 118, 0.4) !important;
        }

        .main-products-container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 24px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #0d131f;
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .product-img-wrapper {
            width: 100%;
            height: 220px;
            background: #090e17;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border-glass);
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .current-price {
            font-size: 22px;
            font-weight: 900;
            color: var(--saudi-green);
        }

        .btn-add {
            margin-top: auto;
            width: 100%;
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 10px;
            padding: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-add:hover {
            background: var(--primary);
            color: #040910;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            width: 92%;
            max-width: 440px;
            padding: 30px;
            background: #0d131f;
            border: 1px solid var(--border-glass);
            border-radius: 20px;
        }

        .btn-national {
            background: linear-gradient(135deg, #00e676, #009640);
            color: #040910;
            font-weight: 800;
            border: none;
            cursor: pointer;
            border-radius: 30px;
            width: 100%;
            padding: 12px;
        }
    </style>
</head>
<body>

    <div class="top-announcement-bar">
        <span>🚚 شحن فوري ومجاني لجميع مدن المملكة للطلبات فوق 300 ر.س | كود: <strong>KSA96</strong></span>
    </div>

    <div id="loginModal" class="modal-overlay" style="display: flex;">
        <div class="modal-content" style="border: 2px solid rgba(0, 230, 118, 0.45);">
            <div style="text-align: center; margin-bottom: 15px;">
                <div class="logo-badge" style="margin: 0 auto 10px;"><i class="fa-solid fa-lock"></i></div>
                <h2 style="color: #fff; font-size: 20px;">تسجيل الدخول للمتجر</h2>
            </div>
            <form id="authForm">
                <input type="text" id="authUsername" placeholder="اسم المستخدم (Badr1122)" style="width: 100%; padding: 12px; margin-bottom: 10px; background: #070a10; border: 1px solid var(--border-glass); border-radius: 8px; color: #fff;" required>
                <input type="password" id="authPassword" placeholder="كلمة المرور (Badr1122)" style="width: 100%; padding: 12px; margin-bottom: 15px; background: #070a10; border: 1px solid var(--border-glass); border-radius: 8px; color: #fff;" required>
                <button type="submit" class="btn-national">دخول المتجر</button>
            </form>
        </div>
    </div>

    <header class="dark-navbar">
        <div class="nav-container">
            <div class="nav-right-group">
                <button class="round-menu-btn" type="button">
                    <div class="menu-line"></div>
                    <div class="menu-line" style="width: 12px;"></div>
                </button>
                <div class="logo">
                    <div class="logo-badge"><i class="fa-solid fa-bolt"></i></div>
                    <span>Tech<span class="logo-accent">Gear</span></span>
                </div>
            </div>
            <div class="search-bar-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="ابحث عن بكج، سوني، مايك، آيفون...">
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active-link">الرئيسية</a></li>
                <li><button class="sign-in-btn" id="userBtnText">تسجيل الدخول</button></li>
            </ul>
        </div>
    </header>

    <section class="categories-tabs-section">
        <div class="tactical-nav">
            <button class="tactical-tab active-tab"><span>الكل</span></button>
            <button class="tactical-tab"><span>القيمنق</span></button>
            <button class="tactical-tab"><span>السوني</span></button>
            <button class="tactical-tab"><span>الأجهزة الذكية</span></button>
            <button class="tactical-tab"><span>الطاولات</span></button>
        </div>
    </section>

    <main class="main-products-container">
        <div class="products-grid" id="productsGrid"></div>
    </main>

    <script>
        const products = [
            { name: "Apple iPhone 16 Pro Max سعة 256GB", price: 4899, img: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?auto=format&fit=crop&w=600&q=80" },
            { name: "Sony PlayStation 5 Pro الأصلي", price: 2999, img: "https://images.unsplash.com/photo-1606813907291-d86efa9b94db?auto=format&fit=crop&w=600&q=80" },
            { name: "بكج ألعاب متكامل: شاشة + كرسي + سماعة", price: 3699, img: "https://images.unsplash.com/photo-1593305841991-05c297ba4575?auto=format&fit=crop&w=600&q=80" },
            { name: "دركسون Logitech G29 مع البدالات والقير", price: 1099, img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80" },
            { name: "ميكروفون Fifine AmpliGame AM8 ديناميكي", price: 249, img: "https://images.unsplash.com/photo-1590602847861-f357a9332bbc?auto=format&fit=crop&w=600&q=80" },
            { name: "طاولة قيمنق Pro Carbon Fiber 140سم", price: 649, img: "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=600&q=80" }
        ];

        const grid = document.getElementById("productsGrid");
        grid.innerHTML = products.map(p => `
            <div class="product-card">
                <div class="product-img-wrapper"><img src="${p.img}" alt="${p.name}"></div>
                <div class="product-card-body">
                    <h4>${p.name}</h4>
                    <div class="current-price">${p.price.toLocaleString()} ر.س</div>
                    <button class="btn-add">أضف إلى السلة</button>
                </div>
            </div>
        `).join("");

        document.getElementById("authForm").addEventListener("submit", (e) => {
            e.preventDefault();
            document.getElementById("loginModal").style.display = "none";
            document.getElementById("userBtnText").innerText = "Badr1122";
        });
    </script>
</body>
</html>
